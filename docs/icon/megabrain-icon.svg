<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14100c"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2ac2b"/>
      <stop offset="100%" stop-color="#e0651a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#e0651a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e0651a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#glow)"/>

  <!-- rede de nós: representa routing/cache entre "pontos" de decisão -->
  <g stroke="url(#node)" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="512" y1="330" x2="340" y2="470"/>
    <line x1="512" y1="330" x2="684" y2="470"/>
    <line x1="340" y1="470" x2="512" y2="600"/>
    <line x1="684" y1="470" x2="512" y2="600"/>
    <line x1="340" y1="470" x2="230" y2="640"/>
    <line x1="684" y1="470" x2="794" y2="640"/>
    <line x1="512" y1="600" x2="512" y2="740"/>
  </g>

  <circle cx="512" cy="330" r="58" fill="url(#node)"/>
  <circle cx="340" cy="470" r="46" fill="url(#node)"/>
  <circle cx="684" cy="470" r="46" fill="url(#node)"/>
  <circle cx="512" cy="600" r="52" fill="url(#node)"/>
  <circle cx="230" cy="640" r="34" fill="url(#node)" opacity="0.85"/>
  <circle cx="794" cy="640" r="34" fill="url(#node)" opacity="0.85"/>
  <circle cx="512" cy="740" r="38" fill="url(#node)" opacity="0.85"/>
</svg>
